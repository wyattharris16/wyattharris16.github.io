<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="t2" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t2">Cap rate triangle: NOI equals value times cap rate</title>
  <rect width="600" height="260" fill="#fffaf0"/>
  <polygon points="300,20 520,230 80,230" fill="#fdebd3" stroke="#2f3e46" stroke-width="4"/>
  <line x1="150" y1="150" x2="450" y2="150" stroke="#2f3e46" stroke-width="4"/>
  <line x1="300" y1="150" x2="300" y2="230" stroke="#2f3e46" stroke-width="4"/>
  <text x="300" y="115" font-family="Georgia" font-size="30" font-weight="bold" text-anchor="middle" fill="#b5523b">NOI</text>
  <text x="225" y="200" font-family="Georgia" font-size="24" font-weight="bold" text-anchor="middle" fill="#2f3e46">Value</text>
  <text x="375" y="200" font-family="Georgia" font-size="24" font-weight="bold" text-anchor="middle" fill="#2f3e46">Cap Rate</text>
  <text x="300" y="253" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">Cover the one you want: NOI = Value × Cap Rate</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
