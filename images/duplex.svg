<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Illustration of a two-unit rental duplex</title>
  <rect width="600" height="400" fill="#e8f1ec"/>
  <circle cx="500" cy="80" r="40" fill="#f2c14e"/>
  <rect x="0" y="320" width="600" height="80" fill="#7fb069"/>
  <!-- left unit -->
  <rect x="110" y="170" width="190" height="150" fill="#f7f3e8" stroke="#2f3e46" stroke-width="4"/>
  <polygon points="95,175 205,90 315,175" fill="#b5523b" stroke="#2f3e46" stroke-width="4"/>
  <!-- right unit -->
  <rect x="300" y="170" width="190" height="150" fill="#efe6d2" stroke="#2f3e46" stroke-width="4"/>
  <polygon points="285,175 395,90 505,175" fill="#a2442f" stroke="#2f3e46" stroke-width="4"/>
  <!-- doors -->
  <rect x="185" y="250" width="40" height="70" fill="#2f3e46"/>
  <rect x="375" y="250" width="40" height="70" fill="#2f3e46"/>
  <!-- windows -->
  <g fill="#9cc5e0" stroke="#2f3e46" stroke-width="3">
    <rect x="130" y="195" width="40" height="35"/><rect x="240" y="195" width="40" height="35"/>
    <rect x="320" y="195" width="40" height="35"/><rect x="430" y="195" width="40" height="35"/>
  </g>
  <text x="205" y="150" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">A</text>
  <text x="395" y="150" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">B</text>
  <!-- sign -->
  <rect x="520" y="250" width="8" height="70" fill="#5c4033"/>
  <rect x="488" y="225" width="72" height="34" fill="#fff" stroke="#2f3e46" stroke-width="3"/>
  <text x="524" y="248" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#b5523b">FOR RENT</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
